<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客舍萬事屋 | 鄰里交流對話區</title>
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #fcfbf7; color: #334155; padding-bottom: 3rem; }
        .hidden { display: none !important; }

        .btn-base { padding: 0.625rem 1.25rem; border-radius: 0.875rem; font-weight: 700; font-size: 0.85rem; border: none; cursor: pointer; transition: all 0.2s ease; }
        .btn-orange { background-color: #ea580c; color: #ffffff; box-shadow: 0 4px 6px -1px rgba(234, 88, 12, 0.2); border: none; cursor: pointer; font-weight: 700; border-radius: 0.75rem; }
        .btn-orange:hover { background-color: #c2410c; }

        .main-layout { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1rem; }
        .layout-spacing { display: flex; flex-direction: column; gap: 1.5rem; }

        /* Banner */
        .hero-banner { background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border: 1.5px solid #fde68a; border-radius: 1.5rem; padding: 2rem; text-align: center; }
        .hero-title { font-size: 1.75rem; font-weight: 900; color: #78350f; }
        .hero-title-sub { display: block; font-size: 0.85rem; color: #b45309; margin-top: 0.25rem; }
        .hero-desc-wrapper { margin-top: 1.25rem; font-size: 0.875rem; line-height: 1.7; color: #92400e; text-align: left; background: rgba(255,255,255,0.6); padding: 1.25rem; border-radius: 1rem; }

        /* 數據統計面板 */
        .community-stats-bar {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px dashed #fde68a;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .stat-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: #ffffff;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            border: 1px solid #fcd34d;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse 1.6s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* Tabs */
        .tabs-row { display: flex; gap: 0.5rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 0.5rem; overflow-x: auto; }
        .tab-btn { padding: 0.625rem 1.25rem; border-radius: 0.75rem; background: transparent; border: none; font-size: 0.875rem; font-weight: 700; color: #64748b; cursor: pointer; white-space: nowrap; }
        .tab-active-orange { background-color: #fff7ed !important; color: #c2410c !important; }
        .tab-btn-flex { display: flex; align-items: center; gap: 0.375rem; }

        /* 聊天室專屬排版 */
        .chat-container { background: #fff; border-radius: 1.5rem; border: 1.5px solid #fffbeb; padding: 1.5rem; box-shadow: 0 10px 25px -5px rgba(251, 191, 36, 0.05); min-height: 500px; width: 100%; }
        .chat-layout-grid { display: grid; grid-template-columns: 280px 1fr; gap: 1.5rem; width: 100%; }
        @media(max-width: 768px) { .chat-layout-grid { grid-template-columns: 1fr; } }
        
        .topic-sidebar { border-right: 1px solid #f1f5f9; padding-right: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .topic-item { padding: 0.75rem 1rem; border-radius: 0.75rem; cursor: pointer; transition: 0.2s; background: #f8fafc; border: 1px solid #e2e8f0; }
        .topic-item:hover { background: #fff7ed; border-color: #fed7aa; }
        .topic-item.active { background: #ea580c; color: white; border-color: #ea580c; }
        .topic-item.active p { color: #ffedd5 !important; }

        .chat-main-area { display: flex; flex-direction: column; height: 500px; }
        
        /* WhatsApp 風格聊天視窗底色 */
        .chat-messages-box { 
            flex: 1; 
            overflow-y: auto; 
            background-color: #efeae2;
            background-image: radial-gradient(#cbd5e1 0.75px, transparent 0.75px);
            background-size: 12px 12px;
            border-radius: 1rem; 
            padding: 1rem; 
            display: flex; 
            flex-direction: column; 
            gap: 0.6rem; 
            margin-bottom: 1rem; 
            border: 1px solid #e2e8f0; 
        }

        /* WhatsApp 氣泡通用樣式 */
        .msg-bubble {
            max-width: 75%;
            padding: 0.5rem 0.75rem 0.35rem 0.75rem;
            border-radius: 0.6rem;
            position: relative;
            font-size: 0.85rem;
            line-height: 1.45;
            box-shadow: 0 1px 1.5px rgba(0,0,0,0.12);
            word-break: break-word;
        }

        /* 他人發送的訊息 (靠左、白底) */
        .msg-row-other { display: flex; justify-content: flex-start; }
        .msg-bubble-other { background-color: #ffffff; color: #111827; border-top-left-radius: 0.1rem; }

        /* 自己發送的訊息 (靠右、暖橘底) */
        .msg-row-self { display: flex; justify-content: flex-end; }
        .msg-bubble-self { background-color: #ffedd5; color: #7c2d12; border-top-right-radius: 0.1rem; }

        .msg-sender-name { font-size: 0.7rem; font-weight: 700; color: #ea580c; margin-bottom: 0.15rem; display: block; }
        .msg-time-stamp { font-size: 0.6rem; color: #94a3b8; float: right; margin-left: 0.5rem; margin-top: 0.2rem; user-select: none; }

        .input-field { width: 100%; padding: 0.625rem; background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 0.75rem; font-size: 0.875rem; }
        .input-field:focus { outline: none; border-color: #ea580c; }

        /* 管理端 Navbar */
        .admin-nav { background-color: #1c1917; color: #ffffff; padding: 1rem; border-bottom: 2px solid #ea580c; }
    </style>
</head>
<body>

    <!-- 頂部管理選單 -->
    <div id="admin-navbar" class="hidden admin-nav">
        <div style="max-width: 64rem; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; gap: 0.5rem; color: #fb923c; align-items: center;">
                <i data-lucide="shield"></i><strong>萬事屋全域管理端</strong>
            </div>
            <div id="admin-logged-out" style="display: flex; gap: 8px;">
                <input type="password" id="admin-password-input" placeholder="管理密碼" class="input-field" style="padding: 4px 8px; width: 120px;">
                <button onclick="handleAdminLogin()" class="btn-orange" style="padding: 4px 12px;">登入</button>
            </div>
            <div id="admin-logged-in" class="hidden" style="display: flex; gap: 10px; align-items: center;">
                <span style="color: #4ade80; font-size: 0.8rem;">🟢 主理人已登入</span>
                <button onclick="handleAdminLogout()" style="background:#64748b; color:white; border:none; padding:4px 8px; border-radius:6px; cursor:pointer;">登出</button>
            </div>
        </div>
    </div>

    <!-- 主頁面 -->
    <main class="main-layout">
        <div class="layout-spacing">
            
            <div class="hero-banner">
                <div onclick="toggleAdminNavbar()" style="cursor: pointer;">
                    <h1 class="hero-title">客舍萬事屋</h1>
                    <span class="hero-title-sub">Slow Pace Skill Supermarket — 鄰里交流區</span>
                </div>
                <div class="hero-desc-wrapper">
                    <p>這是一個獨立於委託之外的自由聚落。在這裡，您可以隨意參與各個主題討論，或與鄰里分享生活點滴。</p>
                    
                    <!-- 在線人數與名冊總人數面板 -->
                    <div class="community-stats-bar">
                        <span class="stat-badge" style="color: #15803d;">
                            <span class="pulse-dot"></span>
                            線上人數：<strong id="online-users-count">1</strong> 人
                        </span>
                        <span class="stat-badge" style="color: #b45309;">
                            📜 居民名冊：<strong id="total-users-count">0</strong> 人
                        </span>
                    </div>
                </div>
            </div>

            <!-- 分頁切換列 -->
            <div class="tabs-row">
                <button id="tab-active" onclick="window.open('https://studioslowpace.com/skillsupermarket.html', '_blank')" class="tab-btn">等待幫助的委託</button>
                <button id="tab-chat" onclick="switchTab('chat')" class="tab-btn tab-active-orange tab-btn-flex"><span>💬 鄰里交流對話區</span></button>
            </div>

            <!-- 💬 獨立聊天室頁面容器 -->
            <div id="chat-page-section" class="chat-container">
                
                <!-- 🔒 驗證牆 (雙欄位驗證：聯絡方式 + 姓名) -->
                <div id="chat-verify-box" style="max-width: 28rem; margin: 3rem auto; background: #fff7ed; padding: 2rem; border-radius: 1.5rem; border: 1.5px solid #fed7aa; text-align: center; box-shadow: 0 10px 25px -5px rgba(251,191,36,0.1);">
                    <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">🏮</div>
                    <h3 style="font-size: 1.2rem; font-weight: 800; color: #78350f; margin-bottom: 0.5rem;">鄰里交流區 僅限萬事屋居民</h3>
                    <p style="font-size: 0.8rem; color: #92400e; line-height: 1.6; margin-bottom: 1.25rem;">
                        請輸入您在客舍萬事屋登記的**聯絡方式 (IG/電話)** 與 **姓名/稱呼**，兩者皆相符方可進入。
                    </p>
                    <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                        <input type="text" id="chat-verify-contact" placeholder="請輸入您的聯絡方式 (例如 IG / 電話)" class="input-field" style="text-align: center; font-size: 0.9rem;">
                        <input type="text" id="chat-verify-name" placeholder="請輸入您的姓名 / 稱呼" class="input-field" style="text-align: center; font-size: 0.9rem;">
                        <button onclick="verifyChatUser()" class="btn-orange" style="padding: 0.75rem; font-size: 0.9rem;">驗證並進入交流區</button>
                    </div>
                </div>

                <!-- 🔓 聊天對話區 (WhatsApp 風格) -->
                <div id="chat-unlocked-box" class="chat-layout-grid hidden">
                    
                    <!-- 左側：主題清單 -->
                    <div class="topic-sidebar">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                            <h4 style="font-size: 0.9rem; font-weight: 800; color: #1e293b;">📌 討論區主題</h4>
                            <button id="btn-add-topic" onclick="openTopicModal()" class="hidden btn-orange" style="padding: 2px 8px; font-size: 0.75rem;">+ 新增主題</button>
                        </div>
                        <div id="topics-list-container" style="display: flex; flex-direction: column; gap: 0.5rem; overflow-y: auto; max-height: 380px;"></div>
                        
                        <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid #f1f5f9;">
                            <button onclick="logoutChatUser()" style="width: 100%; padding: 0.4rem; background: #f1f5f9; color: #64748b; border: none; border-radius: 0.5rem; font-size: 0.75rem; cursor: pointer;">切換驗證身分</button>
                        </div>
                    </div>

                    <!-- 右側：WhatsApp 風格聊天區域 -->
                    <div class="chat-main-area">
                        <div style="margin-bottom: 0.75rem;">
                            <h3 id="current-topic-title" style="font-size: 1rem; font-weight: 800; color: #ea580c;">載入中...</h3>
                            <p id="current-topic-desc" style="font-size: 0.75rem; color: #94a3b8;">請選擇左側主題開始對話</p>
                        </div>

                        <!-- WhatsApp 聊天訊息顯示框 -->
                        <div id="topic-chat-messages" class="chat-messages-box">
                            <p style="font-size: 0.75rem; color: #94a3b8; text-align: center; margin: auto;">請選擇一個討論主題</p>
                        </div>

                        <!-- 發送訊息輸入框 -->
                        <form onsubmit="handleSendTopicMessage(event)" style="display: flex; gap: 0.5rem;">
                            <input type="text" id="chat-sender-name" readonly class="input-field" style="width: 120px; background: #f1f5f9; color: #64748b; font-weight: bold;" title="已自動綁定您的身份">
                            <input type="text" id="chat-input-content" placeholder="輸入訊息..." required class="input-field" style="flex: 1;">
                            <button type="submit" class="btn-orange" style="padding: 0 1.25rem;">發送</button>
                        </form>
                    </div>

                </div>

            </div>

        </div>
    </main>

    <!-- 彈窗：新增主題 Modal (已加入密碼設定) -->
    <div id="topic-modal" class="hidden" style="position: fixed; inset:0; background: rgba(15,23,42,0.6); display:flex; align-items:center; justify-content:center; z-index:1000; padding:1rem;">
        <div style="background:white; padding:1.5rem; border-radius:1rem; width:100%; max-width:24rem; display:flex; flex-direction:column; gap:1rem;">
            <h3 style="font-size: 1rem; font-weight: 800; color: #1e293b;">📌 新增討論區主題</h3>
            <form onsubmit="handleCreateTopic(event)" style="display:flex; flex-direction:column; gap:0.75rem;">
                <div>
                    <label style="font-size:0.75rem; font-weight:bold; color:#6b7280;">主題名稱</label>
                    <input type="text" id="new-topic-title" required class="input-field" placeholder="例如: 🔒 核心幹部秘密基地">
                </div>
                <div>
                    <label style="font-size:0.75rem; font-weight:bold; color:#6b7280;">主題簡介</label>
                    <input type="text" id="new-topic-desc" class="input-field" placeholder="簡單描述這個主題的內容">
                </div>
                <div>
                    <label style="font-size:0.75rem; font-weight:bold; color:#ea580c;">設定進入密碼 (選填)</label>
                    <input type="password" id="new-topic-password" class="input-field" placeholder="留空代表公開，不需密碼">
                </div>
                <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
                    <button type="button" onclick="closeTopicModal()" style="flex:1; padding:0.5rem; background:#f3f4f6; border:none; border-radius:0.75rem; font-weight:bold; cursor:pointer;">取消</button>
                    <button type="submit" class="btn-orange" style="flex:1; padding:0.5rem;">確認建立</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        const supabaseUrl = 'https://blqlrxqckiuvgevmakbu.supabase.co';
        const supabaseKey = 'sb_publishable_qFXwpuGChVdRwjc9K7prVQ_PgYmlnpG';
        const client = supabase.createClient(supabaseUrl, supabaseKey);
        const defaultPassword = "slow2024";

        let allUserRecords = [];
        let topics = [];
        let activeTopicId = null;
        let chatSubscription = null;
        let presenceChannel = null;
        let unlockedTopics = {};
        let isAdmin = false;

        window.onload = function() {
            fetchAllUserRecordsFromSupabase();
            checkAndInitChatState();
            initPresenceTracker();
            lucide.createIcons();
        };

        async function fetchAllUserRecordsFromSupabase() {
            try {
                const { data, error } = await client.from('alluser_record').select('*');
                if (error) throw error;
                allUserRecords = data || [];
                document.getElementById('total-users-count').textContent = allUserRecords.length;
            } catch (err) { console.error("讀取用戶紀錄失敗:", err.message); }
        }

        function initPresenceTracker() {
            const savedContact = localStorage.getItem('verified_chat_contact');
            const savedName = localStorage.getItem('verified_chat_name');
            
            if (!savedContact || !savedName) {
                document.getElementById('online-users-count').textContent = '1 (未驗證)';
                return;
            }

            if (presenceChannel) {
                client.removeChannel(presenceChannel);
            }

            presenceChannel = client.channel('community-online-room', {
                config: { presence: { key: savedContact } }
            });

            presenceChannel
                .on('presence', { event: 'sync' }, () => {
                    const state = presenceChannel.presenceState();
                    const uniqueOnlineUsers = Object.keys(state).length;
                    document.getElementById('online-users-count').textContent = uniqueOnlineUsers;
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await presenceChannel.track({
                            name: savedName,
                            online_at: new Date().toISOString()
                        });
                    }
                });
        }

        function verifyChatUser() {
            const inputContact = document.getElementById('chat-verify-contact').value.trim();
            const inputName = document.getElementById('chat-verify-name').value.trim();

            if (!inputContact || !inputName) {
                alert("請完整輸入「聯絡方式」與「姓名」！");
                return;
            }

            const matchedUser = allUserRecords.find(user => 
                user.contact && user.contact.trim() === inputContact &&
                user.name && user.name.trim() === inputName
            );

            if (matchedUser) {
                const verifiedName = matchedUser.name.trim();
                localStorage.setItem('verified_chat_contact', inputContact);
                localStorage.setItem('verified_chat_name', verifiedName);
                unlockChatUI(verifiedName);
                initPresenceTracker();
            } else {
                alert("❌ 驗證失敗！\n您輸入的「聯絡方式」與「姓名」無法在居民名冊中同時對應，請重新確認。");
            }
        }

        function unlockChatUI(userName) {
            document.getElementById('chat-verify-box').classList.add('hidden');
            document.getElementById('chat-unlocked-box').classList.remove('hidden');
            
            const senderInput = document.getElementById('chat-sender-name');
            senderInput.value = userName;
            senderInput.readOnly = true;
            senderInput.style.backgroundColor = '#f1f5f9';
            senderInput.style.color = '#64748b';
            senderInput.style.cursor = 'not-allowed';

            fetchTopics();
        }

        function logoutChatUser() {
            localStorage.removeItem('verified_chat_contact');
            localStorage.removeItem('verified_chat_name');
            if (presenceChannel) client.removeChannel(presenceChannel);
            document.getElementById('chat-unlocked-box').classList.add('hidden');
            document.getElementById('chat-verify-box').classList.remove('hidden');
            document.getElementById('chat-verify-contact').value = '';
            document.getElementById('chat-verify-name').value = '';
        }

        function checkAndInitChatState() {
            const savedContact = localStorage.getItem('verified_chat_contact');
            const savedName = localStorage.getItem('verified_chat_name');
            if (savedContact && savedName) {
                unlockChatUI(savedName);
            } else {
                document.getElementById('chat-verify-box').classList.remove('hidden');
                document.getElementById('chat-unlocked-box').classList.add('hidden');
            }
        }

        async function fetchTopics() {
            try {
                const { data, error } = await client.from('chat_topics').select('*').order('created_at', { ascending: true });
                if (error) throw error;
                topics = data || [];
                renderTopicsList();

                if (topics.length > 0 && !activeTopicId) {
                    trySelectTopic(topics[0].id);
                }
            } catch (err) { console.error("讀取主題失敗:", err.message); }
        }

        function renderTopicsList() {
            const container = document.getElementById('topics-list-container');
            if (!container) return;

            if (topics.length === 0) {
                container.innerHTML = `<p style="font-size:0.75rem; color:#94a3b8; text-align:center;">尚無討論主題</p>`;
                return;
            }

            container.innerHTML = topics.map(topic => {
                const hasPassword = topic.password && topic.password.trim() !== '';
                const lockIcon = hasPassword ? '🔒 ' : '';

                return `
                    <div onclick="trySelectTopic('${topic.id}')" class="topic-item ${String(activeTopicId) === String(topic.id) ? 'active' : ''}">
                        <h5 style="font-size: 0.85rem; font-weight: 700; margin-bottom: 2px;">${lockIcon}${topic.title}</h5>
                        <p style="font-size: 0.7rem; color: #64748b;" class="topic-desc">${topic.description || '無簡介'}</p>
                    </div>
                `;
            }).join('');
        }

        function trySelectTopic(topicId) {
            const topic = topics.find(t => String(t.id) === String(topicId));
            if (!topic) return;

            if (topic.password && topic.password.trim() !== '' && !unlockedTopics[topicId]) {
                const inputPwd = prompt(`🔒 此主題「${topic.title}」需要密碼才能進入：`);
                if (inputPwd === null) return;

                if (inputPwd.trim() === topic.password.trim()) {
                    unlockedTopics[topicId] = true;
                    alert("✅ 密碼正確，進入主題！");
                    selectTopic(topicId);
                } else {
                    alert("❌ 密碼錯誤！");
                }
            } else {
                selectTopic(topicId);
            }
        }

        function selectTopic(topicId) {
            activeTopicId = topicId;
            renderTopicsList();

            const current = topics.find(t => String(t.id) === String(topicId));
            if (current) {
                document.getElementById('current-topic-title').textContent = current.title;
                document.getElementById('current-topic-desc').textContent = current.description || '';
            }

            loadTopicMessages(topicId);
            subscribeToTopicChat(topicId);
        }

        async function loadTopicMessages(topicId) {
            const container = document.getElementById('topic-chat-messages');
            if (!container) return;

            try {
                const { data, error } = await client
                    .from('topic_messages')
                    .select('*')
                    .eq('topic_id', topicId)
                    .order('created_at', { ascending: true });

                if (error) throw error;
                renderTopicMessages(data || []);
            } catch (err) {
                container.innerHTML = `<p style="font-size:0.75rem; color:#ef4444; text-align:center;">載入對話失敗</p>`;
            }
        }

        function renderTopicMessages(messages) {
            const container = document.getElementById('topic-chat-messages');
            if (!container) return;

            if (messages.length === 0) {
                container.innerHTML = `<p style="font-size: 0.75rem; color: #94a3b8; text-align: center; margin: auto;">這個主題還很安靜，留個言開始交流吧！</p>`;
                return;
            }

            const currentUserName = localStorage.getItem('verified_chat_name') || '';

            container.innerHTML = messages.map(msg => {
                const timeStr = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const isSelf = (msg.sender_name === currentUserName);

                if (isSelf) {
                    return `
                        <div class="msg-row-self">
                            <div class="msg-bubble msg-bubble-self">
                                <div>${msg.content}</div>
                                <span class="msg-time-stamp">${timeStr}</span>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="msg-row-other">
                            <div class="msg-bubble msg-bubble-other">
                                <span class="msg-sender-name">${msg.sender_name}</span>
                                <div>${msg.content}</div>
                                <span class="msg-time-stamp">${timeStr}</span>
                            </div>
                        </div>
                    `;
                }
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        async function handleSendTopicMessage(event) {
            event.preventDefault();
            if (!activeTopicId) return;

            const nameInput = document.getElementById('chat-sender-name');
            const contentInput = document.getElementById('chat-input-content');

            if (!nameInput.value.trim() || !contentInput.value.trim()) return;

            try {
                const { error } = await client.from('topic_messages').insert([{
                    topic_id: activeTopicId,
                    sender_name: nameInput.value.trim(),
                    content: contentInput.value.trim()
                }]);

                if (error) throw error;
                contentInput.value = '';
            } catch (err) { alert("發送失敗: " + err.message); }
        }

        function subscribeToTopicChat(topicId) {
            if (chatSubscription) client.removeChannel(chatSubscription);

            chatSubscription = client.channel(`topic-${topicId}`)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'topic_messages', filter: `topic_id=eq.${topicId}` }, () => {
                    loadTopicMessages(topicId);
                })
                .subscribe();
        }

        function openTopicModal() { document.getElementById('topic-modal').classList.remove('hidden'); }
        function closeTopicModal() { document.getElementById('topic-modal').classList.add('hidden'); }

        async function handleCreateTopic(event) {
            event.preventDefault();
            const title = document.getElementById('new-topic-title').value.trim();
            const desc = document.getElementById('new-topic-desc').value.trim();
            const password = document.getElementById('new-topic-password').value.trim();

            if (!title) return;

            try {
                const { error } = await client.from('chat_topics').insert([{ 
                    title, 
                    description: desc, 
                    password: password 
                }]);
                if (error) throw error;

                closeTopicModal();
                document.getElementById('new-topic-title').value = '';
                document.getElementById('new-topic-desc').value = '';
                document.getElementById('new-topic-password').value = '';
                fetchTopics();
                alert("📌 成功建立新討論主題！");
            } catch (err) { alert("建立失敗: " + err.message); }
        }

        function toggleAdminNavbar() { document.getElementById('admin-navbar').classList.toggle('hidden'); }
        function handleAdminLogin() {
            if (document.getElementById('admin-password-input').value === defaultPassword) {
                isAdmin = true;
                document.getElementById('admin-logged-out').classList.add('hidden');
                document.getElementById('admin-logged-in').classList.remove('hidden');
                document.getElementById('btn-add-topic').classList.remove('hidden');
                alert("🟢 主理人權限已解鎖！");
            } else { alert("密碼錯誤"); }
        }
        function handleAdminLogout() {
            isAdmin = false;
            document.getElementById('admin-logged-out').classList.remove('hidden');
            document.getElementById('admin-logged-in').classList.add('hidden');
            document.getElementById('btn-add-topic').classList.add('hidden');
        }

        function switchTab(tab) {
            if (tab === 'active') { window.location.href = 'index.html'; }
        }
    </script>
</body>
</html>
